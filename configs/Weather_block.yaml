diffusion:
  beta_end: 0.2
  beta_start: 0.0001
  channels: 64
  diffusion_embedding_dim: 128
  layers: 4
  nheads: 8
  num_steps: 50
  schedule: quad
  seqlen: 24
model:
  bias_strength: 5.0
  featureemb: 16
  het_gate_init: -0.5
  het_mask_mode: topk_sparse
  lightsae_alpha: 0.1
  lightsae_mode: learnable
  lightsae_pool_size: 5
  lightsae_rank: 3
  neg_bias_strength: 0.0
  timeemb: 128
  top_k_ratio: 0.75
  use_agca_bias: true
  use_het_mask: true
  use_lightsae_embed: true
train:
  alpha: 1
  batch_size: 16
  beta: 0.5
  epochs: 300
  eta: 0
  gamma: 0.05
  lr: 0.001
